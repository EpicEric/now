[package]
name = "now-runner"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
description = "Nix-based distributed command runner"
repository = "https://github.com/EpicEric/now"
homepage = "https://now.dev.br"
license = "AGPL-3.0-or-later"
authors = ["Eric Rodrigues Pires <eric@eric.dev.br>"]
readme = "README.md"
keywords = ["nix", "runner", "task", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "now"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
clap = { version = "4.6.1", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4.6.8", features = ["unstable-dynamic"] }
color-eyre = "0.6.5"
ctrlc = { version = "3.5.2", features = ["termination"] }
dotenvy = "0.15.7"
flate2 = "1.1.9"
futures = "0.3.33"
humantime = "2.4.0"
ignore = "0.4.30"
nix = { version = "0.31.3", features = ["hostname"] }
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
petgraph = "0.8.3"
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smol = "2.0.2"
supports-color = "3.0.2"
tar = "0.4.46"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing_duper = "0.2.0"

[build-dependencies]
flate2 = "1.1.9"
ignore = "0.4.30"
tar = "0.4.46"
