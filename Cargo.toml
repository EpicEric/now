[package]
name = "now-runner"
version = "0.2.1"
edition = "2024"
rust-version = "1.95.0"
description = "Nix-based distributed command runner"
repository = "https://github.com/EpicEric/now"
homepage = "https://now.dev.br"
license = "AGPL-3.0-or-later"
authors = ["Eric Rodrigues Pires <eric@eric.dev.br>"]
readme = "README.md"
keywords = ["nix", "runner", "task", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/nix", "/now-step", "/src"]

[[bin]]
name = "now"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.7"
color-eyre = "0.6.5"
ctrlc = { version = "3.5.2", features = ["termination"] }
dotenvy = "0.15.7"
futures = "0.3.33"
humantime = "2.4.0"
ignore = "0.4.30"
include_dir = "0.7.4"
owo-colors = "4.3.0"
petgraph = "0.8.3"
rand = "0.10.2"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smol = "2.0.2"
sys-info = "0.9.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing_duper = "0.1.1"
