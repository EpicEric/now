on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "now-cache"
  cancel-in-progress: true

jobs:
  build-nix-packages:
    name: Build and push Nix packages (${{ matrix.system }})
    environment: niks3
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-26
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          add-channel: "true"
          extra-conf: |
            extra-substituters = ${{ vars.NIKS3_SERVER_URL }}
            extra-trusted-public-keys = ${{ vars.NIKS3_PUBLIC_KEY }}
      - name: Run now workflow
        env:
          NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
          NIKS3_AUTH_TOKEN: ${{ secrets.NIKS3_AUTH_TOKEN }}
        run: |
          nix run . -- run --workflow .now/cache.nix
